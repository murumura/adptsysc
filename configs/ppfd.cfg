// 2-stage polyphase downsampler configuration
entrance = true // Global symbol indicating filter entry point

FilterConfig {
    name           = "2stage-polyphase-downsampler"
    type           = "decimator"
    architecture   = "polyphase"
    data_width     = 16
    coeff_width    = 24
    n_taps         = 64
    n_stages       = 2
    d_factor       = 8
    d_factor_stage = [4, 2]
    coeff_source   = "embedded"
    coeff_store    = "ROM"
    coeffs         = [0.1, 0.2, 0.3, /* ... 61 more values ... */]
    data_buffer    = "RAM"
    optim_goal     = "area"
    use_symmetry   = true
}

FilterInput {
    name           = "input_stream"           // Name of the input symbol
    source         = "external"               // Source: "external", "memory", "filter"
    data_width     = 16                       // Bit width of input samples (matches FilterConfig)
    data_type      = "fixed-point"            // "fixed-point" or "floating-point"
    sample_rate    = 48000                    // Sample rate in Hz
    buffer_type    = "circular"               // Buffer type: "RAM", "circular", "FIFO"
    buffer_size    = 1024                     // Buffer size in bytes
    binding        = "global"                 // Binding: "local", "global", "weak", "lazy"
    flags          = ["VOLATILE", "ALIGNED"]  // Flags: supports multiple attributes
}